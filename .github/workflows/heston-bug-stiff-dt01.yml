name: Heston BUG uniform-spot stiffness and rank validation
on:
  pull_request:
    paths:
      - 'benchmarks/QTTS/heston_bug_stiff_dt01.jl'
      - '.github/workflows/heston-bug-stiff-dt01.yml'
      - 'src/BUG/**'
      - 'src/QTTS/**'
  workflow_dispatch:
jobs:
  heston-small:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        solver: [rational, gmres, stage]
        initial: [gaussian, multimode]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Actual BUG solve versus independent sparse Radau
        env:
          JULIA_NUM_THREADS: '1'
        run: |
          mkdir -p results/heston-stiff
          julia --project benchmarks/QTTS/heston_bug_stiff_dt01.jl ${{ matrix.solver }} 4 10 ${{ matrix.initial }} dirichlet0 results/heston-stiff/${{ matrix.solver }}-${{ matrix.initial }}.csv bond false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heston-small-${{ matrix.solver }}-${{ matrix.initial }}
          path: results/heston-stiff/
          if-no-files-found: warn
  heston-rank-stress:
    needs: heston-small
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # every local solver at 128x128, to see whether the stiff failure is specific to the
    # Newton-GMRES stage path or shared by the rational-root paths
    strategy:
      fail-fast: false
      matrix:
        solver: [rational, gmres, stage]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Full BUG rank-stress 128x128, dt 0.1
        env:
          JULIA_NUM_THREADS: '1'
        run: |
          mkdir -p results/heston-stress
          julia --project benchmarks/QTTS/heston_bug_stiff_dt01.jl ${{ matrix.solver }} 7 50 multimode dirichlet0 results/heston-stress/${{ matrix.solver }}-multimode.csv bond false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heston-stiff-rank-stress-${{ matrix.solver }}
          path: results/heston-stress/
          if-no-files-found: warn
