name: Adaptive XX benchmark smoke
on:
  pull_request:
    paths:
      - 'src/BUG/Randomised/**'
      - 'benchmarks/QMB/ClosedSystem/xx_adaptive_stopping.jl'
      - '.github/workflows/adaptive-xx.yml'
  workflow_dispatch:

jobs:
  numerical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate Julia dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Test Hermitian Lanczos enrichment recurrence
        run: julia --project test/BUG/Core/RankAdaptation/test_local_lanczos.jl
      - name: Run nearest-neighbor and long-range XX smoke
        env:
          BUG_XX_STEPS: '2'
          BUG_XX_SEEDS: '1'
        run: julia --project benchmarks/QMB/ClosedSystem/xx_adaptive_stopping.jl results/xx-adaptive
      - name: XX strict 24-step benchmark (3 seeds)
        env:
          BUG_XX_STEPS: '24'
          BUG_XX_SEEDS: '3'
        run: julia --project benchmarks/QMB/ClosedSystem/xx_adaptive_stopping.jl results/xx-strict
      - name: XX looser 24-step benchmark (3 seeds)
        env:
          BUG_XX_STEPS: '24'
          BUG_XX_SEEDS: '3'
          BUG_XX_BASIS: '1e-3'
          BUG_XX_TRUNC: '1e-6'
        run: julia --project benchmarks/QMB/ClosedSystem/xx_adaptive_stopping.jl results/xx-loose
      - name: Upload all available numerical results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xx-adaptive-benchmark-results
          path: results/xx-*/
          if-no-files-found: warn
