name: XX U1 d3 d4 short long Krylov DD A B
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/XXT5/xx_policy_specs.jl'
      - 'benchmarks/XXT5/xx_higher_d_large_ab.jl'
      - '.github/workflows/xx-d3-d4-krylov-dd-ab.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate pinned Julia dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: U1 exact-sector validation d3 d4 short long
        env:
          BUG_T5_SMOKE: '1'
          BUG_HIGHER_CASES: '2:4,3:4'
          BUG_HIGHER_INTERACTIONS: 'short,long'
          BUG_HIGHER_STEPS: '2'
          BUG_HIGHER_DT: '0.1'
          BUG_HIGHER_SEEDS: '1'
          BUG_HIGHER_TOLS: '1e-3'
          BUG_HIGHER_SAMPLE_EVERY: '1'
          BUG_HIGHER_MAXDIM: '64'
          BUG_HIGHER_POLICIES: 'T5_fixed4_adaptK,T5_fixed4_adaptK_ddA,T5_fixed4_adaptK_ddB'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/dd-ab-d34-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xx-dd-ab-d34-smoke
          path: results/dd-ab-d34-smoke/
          if-no-files-found: warn
  exact-T5:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: '2:6', interaction: 'short', label: 'd3-short'}
          - {case: '2:6', interaction: 'long', label: 'd3-long'}
          - {case: '3:6', interaction: 'short', label: 'd4-short'}
          - {case: '3:6', interaction: 'long', label: 'd4-long'}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate pinned Julia dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: T5 exact sector ED d3 d4 both interaction ranges
        env:
          BUG_HIGHER_CASES: ${{ matrix.case }}
          BUG_HIGHER_INTERACTIONS: ${{ matrix.interaction }}
          BUG_HIGHER_STEPS: '50'
          BUG_HIGHER_DT: '0.1'
          BUG_HIGHER_SEEDS: '1'
          BUG_HIGHER_TOLS: '1e-3'
          BUG_HIGHER_SAMPLE_EVERY: '5'
          BUG_HIGHER_MAXDIM: '128'
          BUG_HIGHER_POLICIES: 'T5_fixed4_adaptK,T5_fixed4_adaptK_ddA,T5_fixed4_adaptK_ddB'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/dd-ab-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xx-dd-ab-${{ matrix.label }}
          path: results/dd-ab-${{ matrix.label }}/
          if-no-files-found: warn

  l16-pilot:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {twoS: '2', interaction: 'short', label: 'd3-short'}
          - {twoS: '2', interaction: 'long', label: 'd3-long'}
          - {twoS: '3', interaction: 'short', label: 'd4-short'}
          - {twoS: '3', interaction: 'long', label: 'd4-long'}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: L16 higher-d exact charge conservation and cost pilot
        env:
          BUG_DD_AB_L: '16'
          BUG_DD_AB_TWOS: ${{ matrix.twoS }}
          BUG_DD_AB_RANGE: ${{ matrix.interaction }}
          BUG_DD_AB_STEPS: '5'
          BUG_DD_AB_DT: '0.1'
          BUG_DD_AB_TOL: '1e-3'
          BUG_DD_AB_MAXDIM: '96'
        run: julia --project benchmarks/XXT5/xx_higher_d_large_ab.jl results/dd-ab-L16-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dd-ab-L16-${{ matrix.label }}
          path: results/dd-ab-L16-${{ matrix.label }}/
          if-no-files-found: warn
