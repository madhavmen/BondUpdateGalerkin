name: Revalidate published-style T5 BUG2 adaptive Lanczos old bond cap
on:
  pull_request:
    paths:
      - 'benchmarks/XXT5/summarize_oldcap_revalidation.py'
      - '.github/workflows/xx-revalidate-proven-cap.yml'
  workflow_dispatch:

jobs:
  cap-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate pinned dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Verify old bond maximum is 1.2 times d times pre-step rank
        run: |
          julia --project -e '
            using BondUpdateGalerkin.BUG
            @assert bond_work_ceilings([1,5,10],2,128;factor=1.2)==[3,12,24]
            @assert bond_work_ceilings([1,5,10],3,128;factor=1.2)==[4,18,36]
            @assert bond_work_ceilings([1,5,10],4,128;factor=1.2)==[5,24,48]
            @assert bond_work_ceilings([1,5,10],4,20;factor=1.2)==[5,20,20]
          '
      - name: Real U1 XX small-run cap audit for d2 d3 d4
        env:
          BUG_T5_SMOKE: '1'
          BUG_HIGHER_CASES: '1:4,2:4,3:4'
          BUG_HIGHER_INTERACTIONS: 'short,long'
          BUG_HIGHER_STEPS: '2'
          BUG_HIGHER_DT: '0.05'
          BUG_HIGHER_SEEDS: '1'
          BUG_HIGHER_TOLS: '1e-3'
          BUG_HIGHER_SAMPLE_EVERY: '1'
          BUG_HIGHER_POLICIES: 'T5_fixed4_k8,T5_fixed4_adaptK,tdvp2'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/oldcap-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oldcap-smoke
          path: results/oldcap-smoke/
          if-no-files-found: warn

  T5:
    needs: cap-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: d2-short
            case: '1:10'
            interaction: short
          - label: d2-long
            case: '1:10'
            interaction: long
          - label: d3-short
            case: '2:6'
            interaction: short
          - label: d3-long
            case: '2:6'
            interaction: long
          - label: d4-short
            case: '3:6'
            interaction: short
          - label: d4-long
            case: '3:6'
            interaction: long
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Order2 BUG vs TDVP2, T5, matched-error, ${{ matrix.label }}
        env:
          BUG_HIGHER_CASES: '${{ matrix.case }}'
          BUG_HIGHER_INTERACTIONS: '${{ matrix.interaction }}'
          BUG_HIGHER_STEPS: '50'
          BUG_HIGHER_DT: '0.1'
          BUG_HIGHER_SEEDS: '3'
          BUG_HIGHER_TOLS: '1e-3'
          BUG_HIGHER_SAMPLE_EVERY: '5'
          BUG_HIGHER_MAXDIM: '128'
          BUG_HIGHER_POLICIES: 'T5_fixed4_k8,T5_fixed4_adaptK,tdvp2'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/oldcap-${{ matrix.label }}
      - name: Recalculate savings and paired matched accuracy from actual trajectories
        run: python benchmarks/XXT5/summarize_oldcap_revalidation.py results/oldcap-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oldcap-T5-${{ matrix.label }}
          path: results/oldcap-${{ matrix.label }}/
          if-no-files-found: warn
