name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.11", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Check JuliaFormatter
        run: |
          julia -e 'using Pkg; Pkg.add(name = "JuliaFormatter", version = "1")'
          julia -e 'using JuliaFormatter; format(["src", "test", "docs"])'  # deps/Telum is vendored, not ours to restyle
          git diff > format.patch
          git diff --exit-code
      # A large diff is unreliable to copy from the job log; on failure keep it as a patch to apply.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: format-patch
          path: format.patch
