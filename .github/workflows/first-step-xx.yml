name: XX first-step closure audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/BUG/**'
      - 'benchmarks/QMB/ClosedSystem/xx_first_step_closure_audit.jl'
      - '.github/workflows/first-step-xx.yml'
jobs:
  first-step:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Run first-step exact-reference audit
        run: julia --project benchmarks/QMB/ClosedSystem/xx_first_step_closure_audit.jl results/xx-first-step
      - name: Upload numerical reference CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xx-first-step-audit
          path: results/xx-first-step/
          if-no-files-found: warn
