name: T5 BUG2 separate 2Db frames and 1.2Db root vs TDVP2
on:
  pull_request:
    paths:
      - 'benchmarks/XXT5/xx_T5_matched_work.jl'
      - '.github/workflows/xx-t5-split-frame-root.yml'
  workflow_dispatch:
jobs:
  light-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Check two-tier cap reference and MPO consistency d2-4
        env:
          BUG_T5_SMOKE: '1'
          BUG_HIGHER_CASES: '1:4,2:4,3:4'
          BUG_HIGHER_STEPS: '2'
          BUG_HIGHER_SEEDS: '1'
          BUG_HIGHER_DT: '0.05'
          BUG_HIGHER_SAMPLE_EVERY: '1'
          BUG_HIGHER_TOLS: '1e-2'
          BUG_HIGHER_POLICIES: 'T5_oldstrict_adaptK,T5_split_fixed8,T5_split_adaptK,T5_split_rank,tdvp2'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/xx-T5-split-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xx-T5-split-smoke
          path: results/xx-T5-split-smoke/
          if-no-files-found: warn
  physical-T5:
    needs: light-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: d2-nearest
            case: '1:10'
            interaction: short
          - label: d2-powerlaw
            case: '1:10'
            interaction: long
          - label: d3-nearest
            case: '2:6'
            interaction: short
          - label: d3-powerlaw
            case: '2:6'
            interaction: long
          - label: d4-nearest
            case: '3:6'
            interaction: short
          - label: d4-powerlaw
            case: '3:6'
            interaction: long
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: T5 ${{ matrix.label }} order2 BUG root/frame limits and matched TDVP2 error
        env:
          BUG_HIGHER_CASES: '${{ matrix.case }}'
          BUG_HIGHER_INTERACTIONS: '${{ matrix.interaction }}'
          BUG_HIGHER_STEPS: '50'
          BUG_HIGHER_DT: '0.1'
          BUG_HIGHER_SEEDS: '2'
          BUG_HIGHER_TOLS: '1e-2,1e-3'
          BUG_HIGHER_SAMPLE_EVERY: '5'
          BUG_HIGHER_POLICIES: 'T5_oldstrict_adaptK,T5_split_fixed8,T5_split_adaptK,T5_split_rank,tdvp2'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/T5-split-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T5-split-${{ matrix.label }}
          path: results/T5-split-${{ matrix.label }}/
          if-no-files-found: warn
