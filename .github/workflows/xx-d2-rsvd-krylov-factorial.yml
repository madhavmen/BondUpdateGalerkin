name: XX d2 U1 four Krylov x six RSVD methods
on:
  pull_request:
    paths:
      - 'benchmarks/XXT5/xx_d2_rsvd_krylov_specs.jl'
      - 'benchmarks/XXT5/xx_policy_specs.jl'
      - 'benchmarks/XXT5/xx_T5_matched_work.jl'
      - 'benchmarks/XXT5/xx_L16_krylov_dd_ab.jl'
      - '.github/workflows/xx-d2-rsvd-krylov-factorial.yml'
  workflow_dispatch:

jobs:
  factorial-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Check all 24 policy combinations against independent ED at d2 L6
        env:
          BUG_D2_FACTORIAL: '1'
          BUG_T5_SMOKE: '1'
          BUG_HIGHER_CASES: '1:6'
          BUG_HIGHER_INTERACTIONS: 'short,long'
          BUG_HIGHER_STEPS: '2'
          BUG_HIGHER_DT: '0.1'
          BUG_HIGHER_SEEDS: '1'
          BUG_HIGHER_TOLS: '1e-3'
          BUG_HIGHER_SAMPLE_EVERY: '1'
          BUG_HIGHER_MAXDIM: '64'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/factorial-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2-factorial-smoke
          path: results/factorial-smoke/
          if-no-files-found: warn

  factorial-exact-T5:
    needs: factorial-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        policy: ['fixed','sequential','batched_svd','rank_adaptive','rank_tail','rank_fast']
        range: ['short','long']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Exact U1 L10 T5 matched Krylov RSVD full total-cost comparison
        env:
          BUG_D2_FACTORIAL: '1'
          BUG_HIGHER_CASES: '1:10'
          BUG_HIGHER_INTERACTIONS: ${{ matrix.range }}
          BUG_HIGHER_STEPS: '50'
          BUG_HIGHER_DT: '0.1'
          BUG_HIGHER_SEEDS: '2'
          BUG_HIGHER_TOLS: '1e-3'
          BUG_HIGHER_SAMPLE_EVERY: '10'
          BUG_HIGHER_MAXDIM: '128'
          BUG_HIGHER_POLICIES: ${{ format('{0}__fixed8,{0}__adaptive,{0}__interleaved,{0}__post', matrix.policy) }}
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/factorial-${{ matrix.policy }}-${{ matrix.range }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2-factorial-${{ matrix.policy }}-${{ matrix.range }}
          path: results/factorial-${{ matrix.policy }}-${{ matrix.range }}/
          if-no-files-found: warn

  factorial-L16:
    needs: factorial-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        policy: ['fixed','sequential','batched_svd','rank_adaptive','rank_tail','rank_fast']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: L16 T5 exact free-fermion density reference 4-Krylov RSVD arm
        env:
          BUG_D2_FACTORIAL: '1'
          BUG_DD_AB_L: '16'
          BUG_DD_AB_STEPS: '50'
          BUG_DD_AB_SEEDS: '1'
          BUG_DD_AB_TOLS: '1e-3'
          BUG_DD_AB_MAXDIM: '128'
          BUG_D2_AB_POLICIES: ${{ format('{0}__fixed8,{0}__adaptive,{0}__interleaved,{0}__post', matrix.policy) }}
        run: julia --project benchmarks/XXT5/xx_L16_krylov_dd_ab.jl results/L16-factorial-${{ matrix.policy }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2-L16-factorial-${{ matrix.policy }}
          path: results/L16-factorial-${{ matrix.policy }}/
          if-no-files-found: warn

  tdvp2-accuracy-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {range: 'short', dt: '0.1', steps: '50', sample_every: '10', label: 'short-dt010'}
          - {range: 'long',  dt: '0.1', steps: '50', sample_every: '10', label: 'long-dt010'}
          - {range: 'short', dt: '0.05', steps: '100', sample_every: '20', label: 'short-dt005'}
          - {range: 'long',  dt: '0.05', steps: '100', sample_every: '20', label: 'long-dt005'}
          - {range: 'short', dt: '0.025', steps: '200', sample_every: '40', label: 'short-dt0025'}
          - {range: 'long',  dt: '0.025', steps: '200', sample_every: '40', label: 'long-dt0025'}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: TDVP2 exact-state accuracy and wall time at matched global error
        env:
          BUG_D2_FACTORIAL: '1'
          BUG_HIGHER_CASES: '1:10'
          BUG_HIGHER_INTERACTIONS: ${{ matrix.range }}
          BUG_HIGHER_STEPS: ${{ matrix.steps }}
          BUG_HIGHER_DT: ${{ matrix.dt }}
          BUG_HIGHER_SEEDS: '1'
          BUG_HIGHER_TOLS: '1e-1,1e-2,1e-3'
          BUG_HIGHER_SAMPLE_EVERY: ${{ matrix.sample_every }}
          BUG_HIGHER_MAXDIM: '128'
          BUG_HIGHER_POLICIES: 'tdvp2'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/tdvp2-match-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2-tdvp2-match-${{ matrix.label }}
          path: results/tdvp2-match-${{ matrix.label }}/
          if-no-files-found: warn
