name: Joint minimal-rank DD RSVD + enriched Krylov
on:
  pull_request:
    paths:
      - 'src/BUG/Randomised/cbe.jl'
      - 'src/BUG/Randomised/dd_cbe_expand.jl'
      - 'benchmarks/XXT5/xx_T5_matched_work.jl'
      - '.github/workflows/xx-joint-rank-dd-krylov.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate pinned Julia environment
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Smoke coupled DD ranks and K/L stopping across all physical dimensions
        env:
          BUG_T5_SMOKE: '1'
          BUG_HIGHER_CASES: '1:4,2:4,3:4'
          BUG_HIGHER_STEPS: '2'
          BUG_HIGHER_DT: '0.05'
          BUG_HIGHER_SEEDS: '1'
          BUG_HIGHER_TOLS: '1e-2'
          BUG_HIGHER_SAMPLE_EVERY: '1'
          BUG_HIGHER_POLICIES: 'T5_fixed4_adaptK,T5_rank_adaptK,T5_rank_fixedK8,tdvp2'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/joint-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-dd-krylov-smoke
          path: results/joint-smoke/
          if-no-files-found: warn

  physical-T5:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: d2-long
            case: '1:10'
            model: 'long'
          - label: d3-long
            case: '2:6'
            model: 'long'
          - label: d4-long
            case: '3:6'
            model: 'long'
          - label: d3-short
            case: '2:6'
            model: 'short'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate Julia
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: T5 ${{ matrix.label }} DD-rank / Krylov factorial ablation
        env:
          BUG_HIGHER_CASES: '${{ matrix.case }}'
          BUG_HIGHER_INTERACTIONS: '${{ matrix.model }}'
          BUG_HIGHER_STEPS: '50'
          BUG_HIGHER_DT: '0.1'
          BUG_HIGHER_SEEDS: '2'
          BUG_HIGHER_TOLS: '1e-2,1e-3'
          BUG_HIGHER_SAMPLE_EVERY: '5'
          BUG_HIGHER_MAXDIM: '128'
          BUG_HIGHER_POLICIES: 'T5_fixed4_k8,T5_fixed4_adaptK,sequential_svd_cap12,T5_rank_adaptK,T5_rank_fixedK8,tdvp2'
        run: julia --project benchmarks/XXT5/xx_T5_matched_work.jl results/joint-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-${{ matrix.label }}
          path: results/joint-${{ matrix.label }}/
          if-no-files-found: warn
